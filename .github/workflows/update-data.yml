name: Update Valorant data

on:
  schedule:
    # Every 6 hours, off the hour: GitHub says scheduled runs can be delayed or
    # dropped at the start of the hour.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Refresh the saved copy
        run: npm run update-data

      - name: Commit and publish if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Valorant data"
          git push
          # Pushes made with GITHUB_TOKEN may not start a Pages build by
          # themselves, so ask for one explicitly.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
